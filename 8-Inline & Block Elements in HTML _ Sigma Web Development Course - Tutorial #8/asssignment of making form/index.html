<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>form assignment</title>
</head>
<body>
    <script src="script.js"></script>

    <h3>fill the details for flipkart order</h3>
    <form action="form">

        <div>
            <div>
                <label for="Name">Enter Your Name</label>
                <input type="text" name="Name" id="Name" placeholder="Name" autofocus>
            </div>

            <div>
                <label for="Address">Enter Your Address</label>
                <input type="text" name="Address" id="Address" placeholder="Address" required>
            </div>

            <div>
                <label for="pincode">Enter Your pincode</label>
                <input type="number" maxlength="6" id="pincode" placeholder="000000" required>
            </div>

            <div>
                <input type="radio" name="mode" id="cod" value="cash on delivery">
                <label for="cod">cash on delivery</label>

                <input type="radio" name="mode" id="upi" value="upi before delivery">
                <label for="upi">upi before delivery</label>

                <div>
                    <input type="checkbox" name="permission" id="verify" name="verify">
                    <label for="verify">yes i have checked all these info</label>
                </div>

            </div>
        </div>
        
        
        
        
    </form>
    
</body>

</html>
