<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms - lets learn it</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>form to apply for a job</h1>

    <label for="Username">Username</label>
    <input type="text" autofocus id="username" placeholder="enter your username" name="username" >
    <form action="post"></form>

    <div>
        <input type="radio" name="gender" id="male" value="male">
        <label for="male">male</label>
        <input type="radio" name="gender" value="female" id="female">
        <label for="female">female</label>
    </div>


    <div>
        <input type="checkbox" name="confirm" value="sav" id="confirmation">
        <label for="confirmation">all information are correct</label>
    </div>


    <div>
        <label for="text">enter yout comments...</label>
        <div></div>
        <textarea name="text" id="text"></textarea>
    </div>

    <div>
        <select name="profession">
        <option  value="teacher">teacher</option>
        <option  value="princpal">princpal</option>
        <option  value="head">head</option>
        <option  value="manager">manager</option>
        <option  value="worker">worker</option>
        </select>
    </div>

</body>

</html>
